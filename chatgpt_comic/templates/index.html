<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ComicCraft</title><link rel="stylesheet" href="/static/css/style.css"></head>
<body><div class="hero"><div class="card"><h1>🎨 ComicCraft</h1><p>Create a 5-panel AI comic from one idea.</p>
<form method="post" action="/generate"><label>Story Prompt</label><textarea name="story_prompt" required placeholder="A brave fox exploring an enchanted forest"></textarea>
<div class="grid"><div><label>Main Character</label><input name="character_name" required placeholder="Ravi"></div>
<div><label>Setting</label><select name="setting"><option>Enchanted forest</option><option>School</option><option>Space</option><option>City</option></select></div>
<div><label>Tone</label><select name="tone"><option>Light-hearted</option><option>Dramatic</option><option>Poetic</option><option>Funny</option></select></div>
<div><label>Art Style</label><select name="art_style"><option>Comic book</option><option>Anime</option><option>Pixel art</option><option>Realistic</option></select></div></div>
<button type="submit">✨ Generate Comic</button></form></div></div></body></html>
